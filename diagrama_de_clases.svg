<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .cls-box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 6; }
      .cls-header { fill: #e2e8f0; font-weight: bold; font-size: 13px; text-anchor: middle; }
      .cls-title { font-weight: bold; font-size: 14px; text-anchor: middle; fill: #0f172a; }
      .cls-text { font-size: 11px; fill: #334155; }
      .cls-line { stroke: #64748b; stroke-width: 1.5; }
      .cls-inherit { stroke: #2563eb; stroke-width: 1.5; fill: none; }
      .cls-arrow { fill: #2563eb; }
      .cls-interface { fill: #059669; font-style: italic; font-size: 11px; text-anchor: middle; }
      .cls-impl { stroke: #059669; stroke-width: 1.5; stroke-dasharray: 4; fill: none; }
      .cls-impl-arrow { fill: #059669; }
    </style>
    <marker id="arrow-inherit" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0 0, 10 5, 0 10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    </marker>
    <marker id="arrow-impl" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0 0, 10 5, 0 10" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
    </marker>
    <marker id="arrow-assoc" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polyline points="0 0, 10 5, 0 10" fill="none" stroke="#64748b" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- TITULO -->
  <text x="600" y="30" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">DIAGRAMA DE CLASES - SISTEMA CITYLINK (POO)</text>

  <!-- INTERFACES (ARRIBA) -->
  <!-- Rastreable -->
  <g transform="translate(180, 60)">
    <rect class="cls-box" width="180" height="70" style="stroke: #059669; fill: #f0fdf4;" />
    <text x="90" y="20" class="cls-interface">&lt;&lt;interface&gt;&gt;</text>
    <text x="90" y="38" class="cls-title" fill="#065f46">Rastreable</text>
    <line x1="0" y1="46" x2="180" y2="46" stroke="#a7f3d0" />
    <text x="10" y="60" class="cls-text">+ obtenerEstadoActual(): String</text>
  </g>

  <!-- Facturable -->
  <g transform="translate(420, 60)">
    <rect class="cls-box" width="180" height="70" style="stroke: #059669; fill: #f0fdf4;" />
    <text x="90" y="20" class="cls-interface">&lt;&lt;interface&gt;&gt;</text>
    <text x="90" y="38" class="cls-title" fill="#065f46">Facturable</text>
    <line x1="0" y1="46" x2="180" y2="46" stroke="#a7f3d0" />
    <text x="10" y="60" class="cls-text">+ calcularImporte(): double</text>
  </g>

  <!-- CLIENTE -->
  <g transform="translate(50, 200)">
    <rect class="cls-box" width="170" height="130" />
    <rect x="0" y="0" width="170" height="26" class="cls-header" rx="6" />
    <text x="85" y="18" class="cls-title">Cliente</text>
    <line x1="0" y1="26" x2="170" y2="26" class="cls-line" />
    <text x="10" y="42" class="cls-text">- codigo: int</text>
    <text x="10" y="58" class="cls-text">- nombre: String</text>
    <text x="10" y="74" class="cls-text">- telefono: String</text>
    <text x="10" y="90" class="cls-text">- zona: String</text>
    <line x1="0" y1="98" x2="170" y2="98" class="cls-line" />
    <text x="10" y="114" class="cls-text">+ toString(): String</text>
  </g>

  <!-- PEDIDO (ABSTRACTA) -->
  <g transform="translate(260, 190)">
    <rect class="cls-box" width="220" height="210" style="stroke: #2563eb; fill: #eff6ff;" />
    <rect x="0" y="0" width="220" height="34" class="cls-header" style="fill: #dbeafe;" rx="6" />
    <text x="110" y="16" font-style="italic" font-size="10" fill="#1e40af" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text x="110" y="30" class="cls-title" fill="#1e40af">Pedido</text>
    <line x1="0" y1="34" x2="220" y2="34" stroke="#bfdbfe" />
    <text x="10" y="50" class="cls-text">- codigo: int</text>
    <text x="10" y="66" class="cls-text">- cliente: Cliente</text>
    <text x="10" y="82" class="cls-text">- destino: String</text>
    <text x="10" y="98" class="cls-text">- pesoKg: double</text>
    <text x="10" y="114" class="cls-text">- distanciaKm: double</text>
    <text x="10" y="130" class="cls-text">- estado: String</text>
    <text x="10" y="146" class="cls-text">- vehiculoAsignado: Vehiculo</text>
    <line x1="0" y1="154" x2="220" y2="154" stroke="#bfdbfe" />
    <text x="10" y="170" class="cls-text" font-style="italic">+ calcularCosto(v: Vehiculo)*</text>
    <text x="10" y="186" class="cls-text">+ cambiarEstado(nuevo: String)</text>
    <text x="10" y="202" class="cls-text">+ calcularImporte(): double</text>
  </g>

  <!-- SUBCLASES PEDIDO -->
  <!-- PedidoNormal -->
  <g transform="translate(140, 460)">
    <rect class="cls-box" width="140" height="60" />
    <rect x="0" y="0" width="140" height="24" class="cls-header" rx="6" />
    <text x="70" y="17" class="cls-title">PedidoNormal</text>
    <line x1="0" y1="24" x2="140" y2="24" class="cls-line" />
    <text x="8" y="45" class="cls-text">+ calcularCosto()</text>
  </g>
  <!-- PedidoUrgente -->
  <g transform="translate(300, 460)">
    <rect class="cls-box" width="140" height="60" />
    <rect x="0" y="0" width="140" height="24" class="cls-header" rx="6" />
    <text x="70" y="17" class="cls-title">PedidoUrgente</text>
    <line x1="0" y1="24" x2="140" y2="24" class="cls-line" />
    <text x="8" y="45" class="cls-text">+ calcularCosto()</text>
  </g>
  <!-- PedidoFragil -->
  <g transform="translate(460, 460)">
    <rect class="cls-box" width="140" height="60" />
    <rect x="0" y="0" width="140" height="24" class="cls-header" rx="6" />
    <text x="70" y="17" class="cls-title">PedidoFragil</text>
    <line x1="0" y1="24" x2="140" y2="24" class="cls-line" />
    <text x="8" y="45" class="cls-text">+ calcularCosto()</text>
  </g>

  <!-- VEHICULO (ABSTRACTA) -->
  <g transform="translate(730, 190)">
    <rect class="cls-box" width="220" height="180" style="stroke: #2563eb; fill: #eff6ff;" />
    <rect x="0" y="0" width="220" height="34" class="cls-header" style="fill: #dbeafe;" rx="6" />
    <text x="110" y="16" font-style="italic" font-size="10" fill="#1e40af" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text x="110" y="30" class="cls-title" fill="#1e40af">Vehiculo</text>
    <line x1="0" y1="34" x2="220" y2="34" stroke="#bfdbfe" />
    <text x="10" y="52" class="cls-text">- patente: String</text>
    <text x="10" y="68" class="cls-text">- capacidadKg: double</text>
    <text x="10" y="84" class="cls-text">- velocidadKmH: double</text>
    <text x="10" y="100" class="cls-text">- costoPorKm: double</text>
    <line x1="0" y1="108" x2="220" y2="108" stroke="#bfdbfe" />
    <text x="10" y="126" class="cls-text" font-style="italic">+ calcularTiempoEntrega(km)*</text>
    <text x="10" y="142" class="cls-text">+ puedeTransportar(p: Pedido)</text>
    <text x="10" y="158" class="cls-text">+ getCapacidadKg(): double</text>
  </g>

  <!-- SUBCLASES VEHICULO -->
  <!-- Bicicleta -->
  <g transform="translate(610, 460)">
    <rect class="cls-box" width="150" height="70" />
    <rect x="0" y="0" width="150" height="24" class="cls-header" rx="6" />
    <text x="75" y="17" class="cls-title">Bicicleta</text>
    <line x1="0" y1="24" x2="150" y2="24" class="cls-line" />
    <text x="8" y="44" class="cls-text">+ calcularTiempoEntrega()</text>
    <text x="8" y="58" class="cls-text">+ puedeTransportar()</text>
  </g>
  <!-- Moto -->
  <g transform="translate(780, 460)">
    <rect class="cls-box" width="150" height="60" />
    <rect x="0" y="0" width="150" height="24" class="cls-header" rx="6" />
    <text x="75" y="17" class="cls-title">Moto</text>
    <line x1="0" y1="24" x2="150" y2="24" class="cls-line" />
    <text x="8" y="45" class="cls-text">+ calcularTiempoEntrega()</text>
  </g>
  <!-- Camioneta -->
  <g transform="translate(950, 460)">
    <rect class="cls-box" width="150" height="60" />
    <rect x="0" y="0" width="150" height="24" class="cls-header" rx="6" />
    <text x="75" y="17" class="cls-title">Camioneta</text>
    <line x1="0" y1="24" x2="150" y2="24" class="cls-line" />
    <text x="8" y="45" class="cls-text">+ calcularTiempoEntrega()</text>
  </g>

  <!-- REPARTIDOR -->
  <g transform="translate(520, 200)">
    <rect class="cls-box" width="180" height="150" />
    <rect x="0" y="0" width="180" height="26" class="cls-header" rx="6" />
    <text x="90" y="18" class="cls-title">Repartidor</text>
    <line x1="0" y1="26" x2="180" y2="26" class="cls-line" />
    <text x="8" y="42" class="cls-text">- legajo: int</text>
    <text x="8" y="58" class="cls-text">- nombre: String</text>
    <text x="8" y="74" class="cls-text">- vehiculo: Vehiculo</text>
    <text x="8" y="90" class="cls-text">- pedidos: Pedido[]</text>
    <line x1="0" y1="98" x2="180" y2="98" class="cls-line" />
    <text x="8" y="114" class="cls-text">+ asignarPedido(p: Pedido)</text>
    <text x="8" y="128" class="cls-text">+ registrarEntrega(cod: int)</text>
    <text x="8" y="142" class="cls-text">+ calcularImporte(): double</text>
  </g>

  <!-- CITYLINK GESTOR (ABAJO) -->
  <g transform="translate(300, 600)">
    <rect class="cls-box" width="400" height="170" style="stroke: #0f172a; stroke-width: 2; fill: #f8fafc;" />
    <rect x="0" y="0" width="400" height="30" class="cls-header" style="fill: #cbd5e1;" rx="6" />
    <text x="200" y="20" class="cls-title">CityLink (Gestor Central)</text>
    <line x1="0" y1="30" x2="400" y2="30" class="cls-line" />
    <text x="15" y="48" class="cls-text">- clientes: Cliente[50] | - pedidos: Pedido[100] | - repartidores: Repartidor[10]</text>
    <line x1="0" y1="56" x2="400" y2="56" class="cls-line" />
    <text x="15" y="74" class="cls-text">+ registrarCliente(c: Cliente) / buscarCliente(codigo: int) / buscarCliente(nombre: String)</text>
    <text x="15" y="90" class="cls-text">+ registrarRepartidor(r: Repartidor) / buscarRepartidor(legajo: int)</text>
    <text x="15" y="106" class="cls-text">+ registrarPedido(p: Pedido) / buscarPedido(codigo: int)</text>
    <text x="15" y="122" class="cls-text">+ asignarPedido(codigoPedido: int, legajoRepartidor: int)</text>
    <text x="15" y="138" class="cls-text">+ cambiarEstadoPedido(codigoPedido: int, nuevoEstado: String)</text>
    <text x="15" y="154" class="cls-text">+ precargarDatos(): void</text>
  </g>

  <!-- FLECHAS E IMPLEMENTACIONES -->
  <!-- Pedido implementa Rastreable y Facturable -->
  <path d="M 320 190 L 270 130" class="cls-impl" marker-end="url(#arrow-impl)" />
  <path d="M 420 190 L 480 130" class="cls-impl" marker-end="url(#arrow-impl)" />

  <!-- Repartidor implementa Rastreable y Facturable -->
  <path d="M 540 200 L 330 130" class="cls-impl" marker-end="url(#arrow-impl)" />
  <path d="M 590 200 L 530 130" class="cls-impl" marker-end="url(#arrow-impl)" />

  <!-- Herencia Pedido -->
  <path d="M 210 460 L 210 430 L 370 430 L 370 400" class="cls-inherit" marker-end="url(#arrow-inherit)" />
  <path d="M 370 460 L 370 400" class="cls-inherit" marker-end="url(#arrow-inherit)" />
  <path d="M 530 460 L 530 430 L 370 430" class="cls-inherit" />

  <!-- Herencia Vehiculo -->
  <path d="M 685 460 L 685 410 L 840 410 L 840 370" class="cls-inherit" marker-end="url(#arrow-inherit)" />
  <path d="M 855 460 L 855 410 L 840 410" class="cls-inherit" />
  <path d="M 1025 460 L 1025 410 L 840 410" class="cls-inherit" />

  <!-- Asociaciones -->
  <!-- Cliente a Pedido -->
  <line x1="220" y1="260" x2="260" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-assoc)" />
  <!-- Vehiculo a Pedido -->
  <line x1="730" y1="280" x2="480" y2="280" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3" />
  <!-- Repartidor a Vehiculo -->
  <line x1="700" y1="240" x2="730" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-assoc)" />

  <!-- CityLink gestiona a Cliente, Pedido y Repartidor -->
  <path d="M 350 600 L 135 330" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2" />
  <path d="M 450 600 L 400 400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2" />
  <path d="M 600 600 L 610 350" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2" />

</svg>
